name: test

# The tests on every pull request and every push to main. release.yml builds
# and publishes the image but runs no test, so this is the one check a pull
# request gets before it merges, the dependabot bumps above all, since nothing
# else verifies what they propose.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A superseded run on the same ref is wasted work; cancel it. Unlike release,
  # nothing here publishes, so cancelling mid-flight loses nothing.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # No step here runs git after the checkout: no token left on disk.
          persist-credentials: false

      # Pinned by SHA like every action in release.yml: a mutable tag on a
      # workflow that runs against pull request code is a supply-chain hole.
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # gofmt is not in `go vet`, and an unformatted file is the cheapest
      # review comment there is. -l prints offenders and exits 0, so the
      # failure has to be made explicit.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  # The page tests drive the dashboard in Chromium and WebKit against the real
  # server. A job of their own: they need the browsers and their system
  # libraries, which `test` does without, and they run beside it rather than
  # after it.
  page:
    runs-on: ubuntu-24.04
    # make test-page's own 30-minute timeout, then 10 minutes for the setup
    # (Go, the browsers and their system libraries): a hung test fails with
    # Go's goroutine dump before the job is cancelled.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # go.sum pins playwright-go, which pins the driver and the browsers.
      - name: Cache the browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-${{ runner.os }}-${{ hashFiles('go.sum') }}

      # The Makefile's install runs with --with-deps: it installs the
      # browsers' system libraries, which the cache does not hold.
      - name: Install the browsers
        run: make install-browsers

      # make test-page vets the page tests, then runs them.
      - name: Page tests
        id: page-tests
        env:
          PAGE_ARTIFACTS: ${{ runner.temp }}/page
        run: make test-page

      # Only a failed test leaves traces and screenshots.
      - name: Upload traces and screenshots
        if: failure() && steps.page-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-traces
          path: ${{ runner.temp }}/page
          if-no-files-found: error
          retention-days: 7
